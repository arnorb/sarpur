# Tests, lints and the UI build on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/reference/requirements.txt
      # ruvsarpur's Python: the reference the Rust port is checked against.
      - run: pip install -r tools/reference/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: UI
        working-directory: web
        run: npm ci && npm run build
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Reference tests
        run: python -m unittest discover -s tools/reference -p "test_*.py"
      - name: Record/replay tests
        run: python -m unittest discover -s tools/record
      # The manifest also records the Python patch version, which may differ.
      - name: Golden files unchanged
        run: python tools/golden/generate.py && git diff --exit-code golden/names.jsonl golden/imdb.jsonl
      # Criterion 18: the Rust port against the Python on the fixtures.
      - name: Differential check
        run: python tools/diff/diff.py
